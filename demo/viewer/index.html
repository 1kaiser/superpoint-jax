<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAX Pipeline Viewer</title>
    <!-- Import the component -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #333; color: white; }
        model-viewer { width: 100vw; height: 100vh; background-color: #404040; }
        #status {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="status">Loading...</div>
    <model-viewer
        id="viewer"
        src="/output/pipeline_output.glb"
        alt="A 3D model generated by the Confidence-Gated JAX Pipeline"
        auto-rotate
        camera-controls
        ar
    ></model-viewer>

    <script>
        const viewer = document.querySelector('#viewer');
        const status = document.querySelector('#status');

        viewer.addEventListener('load', () => {
            console.log('Model loaded successfully!');
            status.textContent = 'Model Loaded!';
            // Signal specifically for Puppeteer
            document.body.classList.add('model-loaded');
        });

        viewer.addEventListener('error', (e) => {
            console.error('Error loading model:', e);
            status.textContent = 'Error Loading Model';
            status.style.color = 'red';
        });
    </script>
</body>
</html>
